<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Team Match Play</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f7ee;--ink:#1b2a16;--card:#ffffff;--line:#d3e0c6;--mute:#56684d;--home:#3f6d27;--away:#8f6a1c;--half:#8a9783;--onc:#fff;--brand:#5b8c3a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f190d;--ink:#eaf2e3;--card:#172514;--line:#2c4026;--mute:#9bb08e;--home:#8cc462;--away:#e0b345;--half:#6b7a62;--onc:#0f1a0c;--brand:#5b8c3a}}
:root[data-theme="dark"]{--bg:#0f190d;--ink:#eaf2e3;--card:#172514;--line:#2c4026;--mute:#9bb08e;--home:#8cc462;--away:#e0b345;--half:#6b7a62;--onc:#0f1a0c;--brand:#5b8c3a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.4 "Bricolage Grotesque",system-ui,sans-serif}
#app{max-width:560px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:22px;font-weight:800;margin:4px 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.score{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center}
.score .n{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.score .p{font-size:52px;font-weight:800;line-height:1}
.h{color:var(--home)}.a{color:var(--away)}
.sub{color:var(--mute);font-size:13px;text-align:center;margin-top:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px;font:inherit;cursor:pointer}
.row .pl{font-weight:600;min-width:0}.row .pl small{display:block;color:var(--mute);font-weight:400}
.chip{flex:none;border-radius:6px;padding:5px 9px;font-weight:600;font-size:14px;background:var(--half);color:var(--onc);text-align:center}
.chip.h{background:var(--home);color:var(--onc)}.chip.a{background:var(--away);color:var(--onc)}.chip.n{background:transparent;color:var(--mute);border:1px solid var(--line)}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px}
label{font-size:13px;color:var(--mute)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button.b{font:inherit;font-weight:600;border:0;border-radius:8px;padding:12px 16px;background:var(--home);color:var(--onc);cursor:pointer}
button.b.o{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--away);outline-offset:2px}
.holes{display:grid;grid-template-columns:repeat(9,1fr);gap:5px;margin:10px 0}
.holes button{aspect-ratio:1;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 13px inherit;font-family:inherit;cursor:pointer;padding:0}
.holes .h{background:var(--home);color:var(--onc);border-color:transparent}.holes .a{background:var(--away);color:var(--onc);border-color:transparent}.holes .t{background:var(--half);color:var(--onc);border-color:transparent}
.holes .sel{outline:3px solid var(--ink);outline-offset:1px}
.step{display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0 12px}
.step button{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:26px;cursor:pointer}
.step .v{font-size:44px;font-weight:800;min-width:54px;text-align:center}
.big{text-align:center;font-size:22px;font-weight:800;margin:4px 0 2px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:6px 8px;text-align:center;border-bottom:1px solid var(--line)}
td:last-child,th:last-child{text-align:left}
.err{color:#c0392b;font-size:14px;margin:6px 0}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.live{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--home);margin-right:6px;animation:p 1.6s infinite}@keyframes p{50%{opacity:.25}}@media (prefers-reduced-motion:reduce){.live{animation:none}}
.sp{text-align:center;display:flex;flex-direction:column;gap:2px}.sp small{color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.06em}.sp b{font-size:16px}.sp span{color:var(--mute);font-size:13px}
.brand{background:#fff;border-radius:14px;padding:6px;margin:0;flex:none;width:72px;border:1px solid var(--line)}.dt{display:block;color:var(--mute);font-size:13px;margin-top:3px}
.hdr{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.ttl small{display:block;color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.08em}.ttl b{display:block;font-size:24px;line-height:1.1;font-weight:800;color:var(--home)}
.brand img{display:block;width:100%;height:auto}.brand.sm{width:48px;padding:4px}
body{border-top:6px solid var(--brand)}
.sb{display:grid;grid-template-columns:1fr auto 1fr;border-radius:12px;overflow:hidden;border:1px solid var(--line);margin-bottom:8px}
.sd{padding:12px 8px;text-align:center;color:var(--onc)}.sd.sh{background:var(--home)}.sd.sa{background:var(--away)}
.sd .tn{font-weight:600;font-size:14px;overflow-wrap:anywhere}.sd .pt{font-size:54px;font-weight:800;line-height:1.05}.sd .tw{font-size:11px;letter-spacing:.08em;font-weight:600;opacity:.9}
.mid{background:var(--card);padding:12px 10px;text-align:center;display:flex;flex-direction:column;justify-content:center;font-size:12px;color:var(--mute);min-width:88px}.mid b{font-size:20px;color:var(--ink)}.mid small{margin-top:6px;text-transform:uppercase;letter-spacing:.08em;font-size:10px}
.pb{position:relative;display:flex;height:10px;border-radius:5px;background:var(--line);margin:0 0 12px;overflow:hidden}.pb i{display:block;height:100%}.pb .gap{flex:1}.pb u{position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--card)}
.mc{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px;font:inherit;cursor:pointer}
.mt{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.pn{font-weight:600;font-size:15px;overflow-wrap:anywhere}.pn.r{text-align:right}.pn.w{font-weight:800}
.ct{text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}.ct small{color:var(--mute);font-size:11px}.ct .chip{min-width:54px}
.strip{display:grid;grid-template-columns:repeat(18,1fr);gap:2px;margin-top:10px}
.strip i{height:18px;border-radius:3px;border:1px solid var(--line);font:600 9px/16px "Bricolage Grotesque",system-ui,sans-serif;font-style:normal;text-align:center;color:var(--mute)}
.strip i.h,.lg i.h{background:var(--home);color:var(--onc);border-color:transparent}.strip i.a,.lg i.a{background:var(--away);color:var(--onc);border-color:transparent}.strip i.t,.lg i.t{background:var(--half);color:var(--onc);border-color:transparent}
.md{color:var(--mute);font-size:12px;text-align:right;margin-top:6px}
.lg{font-size:12px;color:var(--mute)}.lg b{color:var(--ink)}.lg div{margin-top:4px}.lg i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px}
.toast{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px;border-radius:10px;text-align:center;z-index:9}
</style>
</head>

  if(played===0)text='Not started';
  else if(done&&lead===0)text='Halved';
  else if(done)text=closed&&rem>0?n+'&'+rem:n+' UP';
  else text=lead===0?'All square':n+' UP';
  var pts=side==='h'?[1,0]:side==='a'?[0,1]:[.5,.5];
  return{lead:lead,played:played,done:done,side:side,n:n,text:text,rem:rem,res:res,pts:pts,dormie:!done&&played>0&&n===rem&&n>0}
}
function thru(c){return c.done?'Final':c.played?'thru '+c.played:''}
function chip(c){
  var cls=c.played===0?'n':c.side==='t'?'':c.side;
  return '<span class="chip '+cls+'">'+esc(c.played&&!c.done&&c.side!=='t'?nm(c.side)+' '+c.text:c.text)+'</span>'
}

var ROSTER=['Dan Loria','David Chitty','Darren Humphrey','Andy Ruck','Andy Toward','Ricky Parker','Jamie Maundrell','James Baldry','Jamie Day','Josh Golding','Byron Greatbatch','Darren Wheston','Grant Carney','Duncan Mutton','Ian Schofield','Sam Schofield','Greg Simpole','Alistair Price','Sam Trotter'];
function homeSel(i){
  var h='<select data-k="hp" data-i="'+i+'"><option value="">Select golfer…</option>';
  ROSTER.forEach(function(n){var used=S.hp.some(function(x,j){return j!==i&&x===n});h+='<option'+(n===S.hp[i]?' selected':'')+(used?' disabled':'')+'>'+n+'</option>'});
  if(S.hp[i]&&ROSTER.indexOf(S.hp[i])<0)h+='<option selected>'+esc(S.hp[i])+'</option>';
  return h+'</select>'
}
function vSetup(){
  var h='<h1>Set up the match</h1><div class="card"><div class="g2"><div><label>Home team</label><input data-k="hn" value="'+esc(S.hn)+'" readonly></div><div><label>Away team</label><input data-k="an" value="'+esc(S.an)+'" placeholder="Away team name"></div></div>';
  for(var i=0;i<8;i++)h+='<div class="g2"><div><label>Game '+(i+1)+' home golfer</label>'+homeSel(i)+'</div><div><label>Game '+(i+1)+' away golfer</label><input data-k="ap" data-i="'+i+'" value="'+esc(S.ap[i])+'"></div></div>';
  h+=(err?'<div class="err">'+esc(err)+'</div>':'')+'<button class="b" data-a="start">'+(S.setup?'Save changes':'Start matches')+'</button>'+(S.setup?' <button class="b o" data-a="back">Cancel</button>':'')+'</div>';
  return h
}

function spStrip(){
  var h='';
  SP.forEach(function(x){if(!x.n&&!W())return;h+='<div class="card sp" style="margin:0"><small>Sponsor</small><b>'+(x.n?esc(x.n):'Sponsor space')+'</b>'+(x.t?'<span>'+esc(x.t)+'</span>':'')+'</div>'});
  return h?'<div class="g2" style="margin-bottom:12px">'+h+'</div>':''
}
function vSponsors(){
  var h='<h1>Sponsors</h1><div class="card">';
  SP.forEach(function(x,i){h+='<label>Sponsor '+(i+1)+' name</label><input data-k="spn" data-i="'+i+'" value="'+esc(x.n)+'" maxlength="60"><label>Message (optional)</label><input data-k="spt" data-i="'+i+'" value="'+esc(x.t)+'" maxlength="90">'});
  return h+'<button class="b" data-a="savesp">Save sponsors</button> <button class="b o" data-a="cancelsp">Cancel</button></div>'
}
function vMain(){
  if(offline)return '<h1>Match play</h1><div class="card">Can’t connect to the scoreboard yet. Check the setup steps and your internet connection, then reload.</div>';
  if(!loaded)return '<h1>Match play</h1><div class="sub">Loading scores…</div>';
  if(!S.setup)return '<h1>Match play</h1><div class="card">The match hasn’t been set up yet. Check back soon.</div><div class="sub"><button class="b o" data-a="signin">Scorer sign in</button></div>';
  var res=[],bh=0,ba=0,lh=0,la=0,i,c;
  for(i=0;i<8;i++){c=calc(i);res.push(c);
    if(c.done){bh+=c.pts[0];ba+=c.pts[1]}
    if(c.played){lh+=c.pts[0];la+=c.pts[1]}}
  var h='<div class="top"><h1><span class="live"></span>Live leaderboard</h1>'+(W()?'<button class="b o" data-a="edit">Edit teams</button>':'')+'</div>';
  var dn=res.filter(function(x){return x.done}).length;
  function pct(v){return (v/8*100).toFixed(1)+'%'}
  h+='<div class="sb"><div class="sd sh"><div class="tn">'+esc(nm('h'))+'</div><div class="pt">'+fmt(lh)+'</div><div class="tw">'+(bh>=4.5?'WINNERS':'4½ TO WIN')+'</div></div><div class="mid"><b>'+dn+'/8</b>Matches complete<small>Live score</small></div><div class="sd sa"><div class="tn">'+esc(nm('a'))+'</div><div class="pt">'+fmt(la)+'</div><div class="tw">'+(ba>=4.5?'WINNERS':'4½ TO WIN')+'</div></div></div>';
  h+='<div class="pb"><i style="width:'+pct(bh)+';background:var(--home)"></i><i style="width:'+pct(lh-bh)+';background:var(--home);opacity:.4"></i><i class="gap"></i><i style="width:'+pct(la-ba)+';background:var(--away);opacity:.4"></i><i style="width:'+pct(ba)+';background:var(--away)"></i><u></u></div>';
  h+=spStrip();
  for(i=0;i<8;i++){c=res[i];
    var cs='';
    for(var k=0;k<18;k++){var x=S.sc[i][k],kc='';if(k<c.played&&x)kc=x[0]<x[1]?'h':x[0]>x[1]?'a':'t';cs+='<i class="'+kc+'">'+(k+1)+'</i>'}
    var rt=c.played===0?'–':c.done&&c.side==='t'?'TIED':c.side==='t'?'AS':c.n+(c.done&&c.rem>0?'&amp;'+c.rem:'UP');
    var cc=c.played===0?'n':c.side==='t'?'':c.side;
    h+='<button class="mc" data-a="open" data-m="'+i+'"><div class="mt"><div class="pn'+(c.side==='h'?' w':'')+'"><span class="h">'+esc(S.hp[i])+'</span></div><div class="ct"><small>Match '+(i+1)+' · '+(c.done?'Final':c.played?'Thru '+c.played:'Not started')+(c.dormie?' · Dormie':'')+'</small><span class="chip '+cc+'">'+rt+'</span></div><div class="pn r'+(c.side==='a'?' w':'')+'"><span class="a">'+esc(S.ap[i])+'</span></div></div></button>'}
  h+='<div class="card lg"><b>Key</b><div>TIED: match halved · AS: all square · 2&amp;1: won by 2 holes with 1 to play · UP: holes ahead</div><div>The score shows the current position, counting games in progress. Solid bar: finished games. Faded bar: games in progress.</div></div>';
  if(W())h+='<div class="sub" style="margin-top:16px"><button class="b o" data-a="sponsors">Edit sponsors</button></div><div class="sub"><button class="b o" data-a="reset">'+(armed?'Tap again to erase everything':'Start a new match')+'</button> <button class="b o" data-a="signout">Sign out</button></div>';
  else h+='<div class="sub" style="margin-top:16px">Updates appear automatically.</div><div class="sub"><button class="b o" data-a="signin">Scorer sign in</button></div>';
  return h
}

function vMatch(){
  var m=cur,c=calc(m),s=S.sc[m][hole]||[null,null],ed=W();
  var h='<div class="top"><button class="b o" data-a="back">Back</button><span class="sub" style="margin:0"><span class="live"></span>Game '+(m+1)+'</span></div>';
  h+='<div class="card"><div class="score" style="grid-template-columns:1fr 1fr"><div class="n h">'+esc(S.hp[m])+'</div><div class="n a">'+esc(S.ap[m])+'</div></div>';
  h+='<div class="big">'+(c.played&&!c.done&&c.side!=='t'?'<span class="'+c.side+'">'+esc(c.side==='a'?S.ap[m]:S.hp[m])+'</span> ':'')+esc(c.text)+'</div><div class="sub" style="margin:0">'+(thru(c)||(ed?'Enter hole 1 to begin':'Not started'))+(c.dormie?' · dormie':'')+'</div></div>';
  h+='<div class="card"><div class="holes">';
  for(var i=0;i<18;i++){var x=S.sc[m][i],k='';
    if(x&&x[0]!=null&&x[1]!=null)k=x[0]<x[1]?'h':x[0]>x[1]?'a':'t';
    h+='<button class="'+k+(ed&&i===hole?' sel':'')+'" '+(ed?'data-a="hole" data-h="'+i+'"':'tabindex="-1"')+'>'+(i+1)+'</button>'}
  h+='</div>';
  if(ed){
    h+='<div class="big">Hole '+(hole+1)+' gross scores</div><div class="g2" style="text-align:center"><div class="h" style="font-weight:600">'+esc(S.hp[m])+'</div><div class="a" style="font-weight:600">'+esc(S.ap[m])+'</div></div><div class="g2">';
    for(var sd=0;sd<2;sd++)h+='<div class="step"><button data-a="step" data-s="'+sd+'" data-d="-1" aria-label="Minus one">−</button><span class="v">'+(s[sd]==null?'–':s[sd])+'</span><button data-a="step" data-s="'+sd+'" data-d="1" aria-label="Plus one">+</button></div>';
    h+='</div>'+(hole<17?'<button class="b" data-a="next" style="width:100%">Next hole</button>':'')+'<div class="sub">Tap a hole number above to correct an earlier score.</div>'
  }else h+='<div class="sub">Green = '+esc(S.hn||'home')+' won the hole, blue = '+esc(S.an||'away')+', grey = halved.</div>';
  h+='</div>';
  if(c.played){
    h+='<div class="card scroll"><table><tr><th>Hole</th><th class="h">'+esc(S.hp[m])+'</th><th class="a">'+esc(S.ap[m])+'</th><th>Status</th></tr>';
    for(i=0;i<c.played;i++){var y=S.sc[m][i],l=c.res[i],st=l===0?'All square':(l>0?nm('h'):nm('a'))+' '+Math.abs(l)+' UP';
      h+='<tr><td>'+(i+1)+'</td><td>'+y[0]+'</td><td>'+y[1]+'</td><td>'+esc(i===c.played-1&&c.done?c.text:st)+'</td></tr>'}
    h+='</table></div>'}
  return h
}

function paint(keep){
  var v=view;
  if(v==='main'&&loaded&&!S.setup&&W())v='setup';
  var y=window.scrollY;
  app.innerHTML=brand(v)+(v==='signin'?vSignin():v==='setup'?vSetup():v==='sponsors'?vSponsors():v==='main'?vMain():vMatch());
  window.scrollTo(0,keep?y:0)
}
function typing(){var a=document.activeElement;return a&&a.tagName==='INPUT'}

function flush(m){
  timers[m]=0;busy[m]=true;
  DB.set('games/g'+m,{sc:encSc(S.sc[m])}).catch(denied).then(function(){busy[m]=false});
}
function queue(m){clearTimeout(timers[m]);timers[m]=setTimeout(function(){flush(m)},350)}

function startSync(){
  DB.on('match',function(d){
    loaded=true;
    if(d&&d.setup){S.setup=true;S.hn='Whipsnade Park';S.an=d.an||'';S.hp=arr8(d.hp);S.ap=arr8(d.ap).map(function(x,q){return x||'Opponent '+(q+1)})}
    else S.setup=false;
    if(!typing())paint(true)
  },function(){offline=true;loaded=true;paint()});
  DB.on('sponsors',function(d){
    if(typing())return;
    var a=(d&&d.s)||[];
    SP=[0,1].map(function(i){return{n:(a[i]&&a[i].n)||'',t:(a[i]&&a[i].t)||''}});
    paint(true)
  },function(){});
  DB.on('games',function(d){
    d=d||{};
    for(var m=0;m<8;m++)if(!timers[m]&&!busy[m])S.sc[m]=d['g'+m]?decSc(d['g'+m].sc):Array(18).fill(null);
    if(!typing())paint(true)
  },function(){offline=true;loaded=true;paint()});
}
function vSignin(){
  return '<h1>Scorer sign in</h1><div class="card"><label>Scorer email</label><input id="em" type="email" autocapitalize="none" autocomplete="username" value="'+esc(SCORER_EMAIL)+'"><label>Scorer password</label><input id="pw" type="password" autocomplete="current-password">'+(err?'<div class="err">'+esc(err)+'</div>':'')+'<button class="b" data-a="dosign">Sign in</button> <button class="b o" data-a="back">Cancel</button></div>'
}

app.addEventListener('input',function(e){
  var t=e.target,k=t.getAttribute('data-k');if(!k)return;
  if(k==='spn'||k==='spt'){SP[+t.getAttribute('data-i')][k==='spn'?'n':'t']=t.value;return}
  if(t.hasAttribute('data-i'))S[k][+t.getAttribute('data-i')]=t.value;else S[k]=t.value;
  if(t.tagName==='SELECT')paint(true);
});
app.addEventListener('click',function(e){
  var t=e.target.closest('[data-a]');if(!t)return;
  var a=t.getAttribute('data-a');
  if(a!=='reset')armed=false;
  if(a==='start'){
    var ok=S.hn.trim()&&S.an.trim()&&S.hp.every(function(x){return x.trim()})&&S.ap.every(function(x){return x.trim()});
    if(!ok){err='Enter both team names and all 16 golfer names to continue.';paint();return}
    err='';S.setup=true;view='main';
    DB.set('match',{setup:true,hn:S.hn.trim(),an:S.an.trim(),hp:S.hp.map(function(x){return x.trim()}),ap:S.ap.map(function(x){return x.trim()})}).catch(denied);
    paint()
  }else if(a==='edit'){view='setup';paint()}
  else if(a==='signin'){view='signin';err='';paint()}
  else if(a==='dosign'){signInWithEmailAndPassword(auth,document.getElementById('em').value.trim(),document.getElementById('pw').value).then(function(){view='main';err='';paint()}).catch(function(e){var c=e&&e.code||'unknown';err=(c==='auth/operation-not-allowed'?'Email/Password sign-in is not switched on in Firebase Authentication. ':c==='auth/invalid-credential'||c==='auth/wrong-password'||c==='auth/user-not-found'||c==='auth/invalid-login-credentials'?'That email and password do not match a user in Firebase Authentication. ':'')+'('+c+')';paint()})}
  else if(a==='signout'){signOut(auth)}
  else if(a==='sponsors'){SPold=JSON.stringify(SP);view='sponsors';paint()}
  else if(a==='cancelsp'){SP=JSON.parse(SPold);view='main';paint()}
  else if(a==='savesp'){SP=SP.map(function(x){return{n:x.n.trim(),t:x.t.trim()}});DB.set('sponsors',{s:SP}).catch(denied);view='main';paint()}
  else if(a==='back'){view='main';paint()}
  else if(a==='open'){cur=+t.getAttribute('data-m');var c=calc(cur);hole=Math.min(c.done?c.played-1:c.played,17);if(hole<0)hole=0;view='match';paint()}
  else if(a==='hole'){hole=+t.getAttribute('data-h');paint(true)}
  else if(a==='next'){if(hole<17)hole++;paint(true)}
  else if(a==='step'){
    var sd=+t.getAttribute('data-s'),d=+t.getAttribute('data-d'),s=(S.sc[cur][hole]||[null,null]).slice();
    s[sd]=s[sd]==null?4:Math.max(1,Math.min(15,s[sd]+d));
    S.sc[cur][hole]=s;queue(cur);paint(true)
  }else if(a==='reset'){
    if(!armed){armed=true;paint(true)}
    else{armed=false;
      for(var m=0;m<8;m++){clearTimeout(timers[m]);timers[m]=0;DB.del('games/g'+m).catch(denied)}
      DB.del('match').catch(denied);
      S.hn='Whipsnade Park';S.an='';S.hp=Array(8).fill('');S.ap=[1,2,3,4,5,6,7,8].map(function(n){return 'Opponent '+n});view='main';paint()}
  }
});
window.addEventListener('hashchange',function(){live=location.hash==='#live';paint(true)});
paint();
if(FIREBASE_CONFIG.apiKey.indexOf('PASTE')===0){offline=true;loaded=true;paint()}
else{
  setupFirebase();
  onAuthStateChanged(auth,function(u){signedIn=!!u;paint(true)});
  startSync();
}
</script>
</body>
</html>
